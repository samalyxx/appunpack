 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#62d9e8" stroke-width="1.4"/></marker>
</defs>
<rect width="1440" height="850" fill="#0b1017"/>
