Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#f1f6ed" >report.md</text><text x="74" y="516" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#f1f6ed" >evidence.json</text><text x="74" y="544" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#f1f6ed" >manifest.xml</text><text x="74" y="572" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#b7f55c" >decompiled/</text><text x="104" y="600" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#9eaab6" >└─ sources/</text><text x="104" y="628" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#9eaab6" >└─ resources/</text><text x="104" y="656" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#9eaab6" >└─ export.json</text><text x="74" y="684" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#f2be71" >decompile.log</text><rect x="564" y="407" width="828" height="326" rx="16" fill="#111b24" stroke="#293641"/><text x="592" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#62d9e8" letter-spacing="1.1">RECOVERED JAVA / ApiDemos.java</text><text x="592" y="487" font-family="Consolas, Liberation Mono, monospace" font-size="20" font-weight="400" fill="#f1f6ed" >public void onCreate(Bundle savedInstanceState) {</text><text x="616" y="527" font-family="Consolas, Liberation Mono, monospace" font-size="20" font-weight="400" fill="#9eaab6" >super.onCreate(savedInstanceState);</text><rect x="587" y="543" width="781" height="45" rx="6" fill="#1b3027" stroke="#385a3b"/><text x="616" y="573" font-family="Consolas, Liberation Mono, monospace" font-size="20" font-weight="400" fill="#b7f55c" >Intent intent = getIntent();</text><text x="616" y="615" font-family="Consolas, Liberation Mono, monospace" font-size="20" font-weight="400" fill="#9eaab6" >// ... remaining method omitted</text><text x="592" y="655" font-family="Consolas, Liberation Mono, monospace" font-size="20" font-weight="400" fill="#f1f6ed" >}</text><text x="592" y="699" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9eaab6" >A recovered method is evidence, not proof of full recovery.</text><text x="48" y="787" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#b7f55c" letter-spacing="1">FILE COUNTS ≠ ENGINE ENTRY COUNTS</text><text x="48" y="820" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9eaab6" >Engine entries: 2,876 classes / 869 resources. Full methodology and source attribution: docs/testing.md</text>
