<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" width="1440" height="850" role="img" aria-labelledby="title desc">
<title id="title">Verified AppUnpack ApiDemos export illustration</title>
<desc id="desc">An illustration, not a screenshot, of real ApiDemos output: 2,860 exported Java files and 978 exported resource files, partial status, 88 errors and 10 warnings. A recovered onCreate method contains Intent intent = getIntent(). File counts differ from engine entry counts. See docs/testing.md for method and fixture source attribution.</desc>
<defs>
