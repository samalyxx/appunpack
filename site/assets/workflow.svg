<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" width="1440" height="480" role="img" aria-labelledby="title desc">
<title id="title">AppUnpack local APK analysis workflow</title>
<desc id="desc">A local APK is inspected and decompiled using JADX. Output includes recovered Java, decoded resources, evidence and a report. Errors and warnings remain visible; partial output can be incomplete.</desc>
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1b2832" stroke-width="1"/></pattern>
 <radialGradient id="glow"><stop stop-color="#193d39" stop-opacity=".65"/><stop offset="1" stop-color="#0b1017" stop-opacity="0"/></radialGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#62d9e8" stroke-width="1.4"/></marker>
</defs>
<rect width="1440" height="480" fill="#0b1017"/>
<text x="48" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="650" fill="#f1f6ed" >From APK to an inspectable workspace.</text><text x="48" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#9eaab6" >The default export runs locally. The target app is never installed or launched.</text><rect x="48" y="166" width="258" height="182" rx="16" fill="#111b24" stroke="#293641"/><g transform="translate(70 185) scale(0.56)"><path d="M14 18 32 8 50 18 32 28 14 18 M14 18v22l18 10 18-10V18 M32 28v22" fill="none" stroke="#b7f55c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M8 12H2v38h6 M56 12h6v38h-6" fill="none" stroke="#62d9e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="78" y="263" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#f1f6ed" >Your APK</text><text x="78" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9eaab6" >A file on your computer</text><path d="M323 257H425" fill="none" stroke="#62d9e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="445" y="166" width="334" height="182" rx="16" fill="#142127" stroke="#456351"/><text x="475" y="209" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#b7f55c" letter-spacing="1.5">APPUNPACK + JADX</text><text x="475" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#f1f6ed" >Inspect + decompile</text><text x="475" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9eaab6" >Hash · manifest · export status</text><path d="M797 257H903" fill="none" stroke="#62d9e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="924" y="145" width="468" height="227" rx="16" fill="#111b24" stroke="#293641"/><text x="950" y="190" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#b7f55c" >sources/</text><text x="1150" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9eaab6" >Recovered Java</text><text x="950" y="238" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#b7f55c" >resources/</text><text x="1150" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9eaab6" >Decoded assets + XML</text><text x="950" y="286" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#62d9e8" >evidence.json</text><text x="1150" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9eaab6" >Identity + engine results</text><text x="950" y="334" font-family="Consolas, Liberation Mono, monospace" font-size="19" font-weight="400" fill="#62d9e8" >report.md</text><text x="1150" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#9eaab6" >Summary + limitations</text><rect x="48" y="405" width="1344" height="39" rx="8" fill="#191d1e" stroke="#3e3730"/><text x="69" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" fill="#f2be71" letter-spacing="1">PARTIAL MEANS PARTIAL</text><text x="290" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#9eaab6" >Errors and warnings stay in the report. Decompiled code may be incomplete.</text>
</svg>
